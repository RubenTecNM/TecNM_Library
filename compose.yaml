name: ${COMPOSE_PROJECT_NAME:-tecnm-library}

services:
  db:
    image: postgres:17.4
    container_name: tecnm-library-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - internal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: tecnm-library-backend:local
    container_name: tecnm-library-backend
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:6060
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:?Falta POSTGRES_DB en .env};Username=${POSTGRES_USER:?Falta POSTGRES_USER en .env};Password=${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-http://localhost:6050,http://127.0.0.1:6050}
    ports:
      - "${TECNM_BACKEND_PORT:-6060}:6060"
    expose:
      - "6060"
    networks:
      - internal_network
      - public_network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: tecnm-library-nginx:local
    container_name: tecnm-library-nginx
    ports:
      - "${TECNM_FRONTEND_PORT:-6050}:6050"
    networks:
      - public_network
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

networks:
  public_network:
    name: tecnm-library-public
  internal_network:
    name: tecnm-library-internal
    internal: true

volumes:
  postgres_data:
    name: tecnm-library-postgres-data
